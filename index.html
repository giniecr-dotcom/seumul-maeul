.li{min-height:44px;align-items:center}
@media (max-width:480px){.win .bd{font-size:14px}.li{font-size:14px;padding:8px 10px}.grid5{gap:3px}.bc{font-size:10px}}

.road{display:flex;gap:2px;height:120px;background:#555;border:3px solid #222;border-radius:6px;overflow:hidden;margin:6px 0}.road .ln{flex:1;position:relative;border-left:2px dashed #ddd}.road .ln:first-child{border-left:0}.road .ob,.road .me{position:absolute;left:0;right:0;text-align:center;font-size:26px}.road .me{bottom:2px}.hud2{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:13px}.prog{height:8px;background:#ddd;border-radius:4px;overflow:hidden;margin:4px 0}.prog i{display:block;height:100%;background:#3fa27a}
.cab{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0}.cw{text-align:center}.cw svg{transition:transform .22s;touch-action:none}.sw{display:flex;gap:6px;justify-content:center;margin-top:2px}.sw button,.gz button{font-size:20px;font-weight:900;border:3px solid #1b1b2f;background:#fff;border-radius:10px;box-shadow:0 3px 0 #000;min-width:52px;min-height:44px;touch-action:manipulation}.gz{display:flex;flex-direction:column;gap:4px}.gz button{min-height:34px;font-size:16px;background:#e9ecf4}.gz button.on{background:#ffd84d}
.ig button{width:72px;height:72px;border-radius:50%;border:3px solid #1b1b2f;background:#e8b830;color:#1b1b2f;font-weight:800;font-size:15px;line-height:1.25;box-shadow:0 4px 0 #1b1b2f}.ig button:active{transform:translateY(3px);box-shadow:0 1px 0 #1b1b2f}.ig button.on{background:#4caf50;color:#fff}
.peds{display:flex;gap:8px;justify-content:center;margin:6px 0 4px}.pd{flex:1;max-width:120px;height:92px;border-radius:12px 12px 8px 8px;border:3px solid #1b1b2f;background:repeating-linear-gradient(0deg,#3a3f4a 0 6px,#2a2e37 6px 10px);color:#fff;font-weight:900;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;box-shadow:0 5px 0 #000;user-select:none;-webkit-user-select:none;touch-action:none;transition:transform .05s}.pd.gs{background:repeating-linear-gradient(0deg,#4a6a4a 0 6px,#335033 6px 10px)}.pd.on{transform:translateY(5px) scale(.97);box-shadow:0 0 0 #000;filter:brightness(1.35)}.pd span{font-size:14px;text-shadow:0 1px 0 #000}
</style>

<body>

    </div>

<script>
/* ===== 독립 실행 버전: 구글 시트(Apps Script) 연결 어댑터 =====
   아래 BACKEND_URL 에 Apps Script 웹 앱 주소(…/exec)를 붙여 넣으면 반 공동 기능이 켜집니다.
   비워 두면 이 기기에만 저장됩니다. */
var BACKEND_URL='https://script.google.com/macros/s/AKfycbwkoZdlC_-BNOrvn2_DmKR1JcCAMJLXPFVtP1_ia_hHb8VIBeH8TL79pCmb4aJ5viz9/exec';
(function(){
  if(!BACKEND_URL||window.claude)return;
  var UIDK='adultRPG_uid',uid=null;
  try{uid=localStorage.getItem(UIDK);}catch(e){}
  if(!uid){uid='u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);try{localStorage.setItem(UIDK,uid);}catch(e){}}
  var snapCb=null,errCb=null,peerCb=null,pendingPlayer=null,pres=null,busy=false,again=false,fails=0,myGc='',timer=null,lastOk=0;
  function call(body){
    return fetch(BACKEND_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json();});
  }
  function sync(){
    if(busy){again=true;return;}
    busy=true;
    var body={a:'sync',uid:uid,gc:myGc,m:pres?pres.m:'',first:!lastOk};
    if(pendingPlayer){body.player=pendingPlayer;}
    if(pres)body.pres=pres;
    var sent=pendingPlayer;pendingPlayer=null;
    call(body).then(function(res){
      busy=false;fails=0;lastOk=Date.now();
      if(!res||!res.ok){if(sent&&!pendingPlayer)pendingPlayer=sent;if(errCb)errCb();return;}
      (res.players||[]).forEach(function(p){if(p.uid===uid&&p.gc&&!myGc)myGc=p.gc;});
      if(snapCb)snapCb(res.players||[]);
      if(peerCb)peerCb(res.peers||[]);
      if(again){again=false;setTimeout(sync,300);}
    }).catch(function(){
      busy=false;fails++;if(sent&&!pendingPlayer)pendingPlayer=sent;
      if(fails>=3&&errCb)errCb();
    });
  }
  function start(){if(timer)return;timer=setInterval(function(){if(!document.hidden||Date.now()-lastOk>30000)sync();},6000);sync();}
  function setUid(u){uid=u;try{localStorage.setItem(UIDK,u);}catch(e){}myGc='';lastOk=0;pendingPlayer=null;}
  function flush(){return new Promise(function(res){var t0=Date.now();(function w(){if(busy&&Date.now()-t0<6000){setTimeout(w,150);return;}sync();setTimeout(function w2(){if(busy&&Date.now()-t0<9000)setTimeout(w2,150);else res();},80);})();});}
  window.ACCT={on:true,uid:function(){return uid;},flush:flush,
    reg:function(gc,nick,pw){return call({a:'reg',gc:gc,nick:nick,pw:pw}).then(function(r){if(r&&r.ok)setUid(r.uid);return r||{ok:0,err:'net'};}).catch(function(){return {ok:0,err:'net'};});},
    login:function(gc,nick,pw){return call({a:'login',gc:gc,nick:nick,pw:pw}).then(function(r){if(r&&r.ok)setUid(r.uid);return r||{ok:0,err:'net'};}).catch(function(){return {ok:0,err:'net'};});},
    logout:function(){setUid('u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4));}};
  window.claude={use:function(name){
    if(name==='user')return Promise.resolve({id:function(){return uid;}});
    if(name==='db')return Promise.resolve({
      collection:function(){return {onSnapshot:function(cb,eb){snapCb=cb;errCb=eb;start();}};},
      doc:function(){return {set:function(p){if(p&&p.gc)myGc=p.gc;pendingPlayer=p;setTimeout(sync,200);return Promise.resolve();}};}
    });
    if(name==='room')return Promise.resolve({
      presence:function(o){pres=o;},
      onPeers:function(cb){peerCb=cb;start();}
    });
    return Promise.resolve(null);
  }};
})();

/* ===================== 설정(선생님이 바꿀 수 있는 값) ===================== */
var CLASS_SIZE = 30;            // 우리 반 인원수 → 공동 게이지 목표 계산에 사용
var TARGET_PER_PERSON = 700;    // 1인당 목표 XP (CLASS_SIZE × 이 값 = 반 공동 목표)
var REWARDS = [                 // 반 공동 게이지 보상 (비율, 이름)
  {p:25,  t:'🍪 교실 간식 타임'},
  {p:50,  t:'🎬 우리 반 영화 한 편'},
  {p:75,  t:'🍕 점심 파티'},
  {p:100, t:'🎉 졸업 전 우리 반 파티'}
];
var MIN_WAGE = 10700;           // 2027년 적용 최저시급(고용노동부 고시)
var STORE = 'adultQuest_v1';

/* ===================== 데이터 ===================== */
var QUESTS = [
 {c:'💰 돈 관리', items:[

 mcq('L06',15,'「소대성전」에서 승상이 잠든 남루한 아이를 깨우지 않고 옷의 이를 잡아 주며 기다리는 행동에서 드러나는 모습은?',['아이를 아끼는 따뜻한 인정','아이를 시험하려는 엄격함','아이를 얕잡아 보는 오만','서두르는 조급함'],0,'행동 하나에서 인물의 성격을 읽는 문제예요. 깨우지 않고 기다리는 모습이 단서입니다.'),
 mcq('L07',15,'“알아주는 사람이 없다”고 탄식하는 인재에게, 재능은 결국 드러난다는 뜻으로 건넬 수 있는 말은?',['자루 속의 송곳은 감춰지지 않는다','굼벵이도 구르는 재주가 있다','우물 안 개구리','소 잃고 외양간 고친다'],0,'낭중지추(囊中之錐)와 같은 말이에요. 굼벵이 속담은 보잘것없는 이도 재주가 하나는 있다는 뜻이라 어긋나요.'),
 mcq('L08',15,'영웅 소설에서 초월적 조력자가 신이한 물건을 주거나 앞일을 미리 알려 주는 까닭으로 가장 알맞은 것은?',['주인공이 능력을 발휘하도록 돕기 위해','주인공을 시험해 떨어뜨리기 위해','주인공의 고난을 더 키우기 위해','독자에게 교훈을 설교하기 위해'],0,'조력자는 주인공의 비범함을 알아보고 위기를 넘기도록 돕는 역할을 해요.'),
 mcq('L09',15,'현진건의 역사 소설 「무영탑」이 바탕으로 삼은 이야기는?',['석가탑을 만든 아사달과 아사녀 설화','선덕여왕과 지귀 설화','바보 온달과 평강공주 설화','서동과 선화공주 설화'],0,'불국사 석가탑(무영탑)을 쌓은 석공 아사달과 아내 아사녀의 설화를 소설로 바꾼 작품이에요.'),
 mcq('L10',15,'「무영탑」에서 아사녀와 주만의 환영이 하나로 합쳐져 부처의 모습으로 변하는 장면이 보여 주는 것은?',['고뇌를 넘어 예술적 경지에 이르는 과정','사랑을 포기하고 절망하는 모습','권력에 굴복하는 모습','복수를 다짐하는 모습'],0,'두 환영이 부처로 합쳐진 뒤 아사달의 마음은 밝아지고 맑아져요. 절망이 아니라 성취의 장면입니다.'),
 mcq('L11',15,'작가와 작품의 연결이 알맞은 것은?',['현진건 - 운수 좋은 날','김유정 - 소나기','이효석 - 동백꽃','황순원 - 메밀꽃 필 무렵'],0,'소나기는 황순원, 동백꽃은 김유정, 메밀꽃 필 무렵은 이효석의 작품이에요.'),
 mcq('L12',15,'김소월의 「진달래꽃」과 한용운의 「님의 침묵」에서 공통으로 중심이 되는 상황은?',['임과의 이별','자연 예찬','전쟁의 참상','도시 생활의 소외'],0,'두 시 모두 떠나는 임, 이별을 다루지만 대하는 태도는 달라요. 태도의 차이를 비교해 보면 좋아요.'),
 mcq('L13',15,'조선 후기 박지원이 양반의 위선과 무능을 풍자한 한문 소설은?',['양반전','홍길동전','사씨남정기','구운몽'],0,'홍길동전은 허균, 사씨남정기와 구운몽은 김만중의 작품으로 알려져 있어요.'),
 mcq('L14',15,'일제 강점기에 「서시」와 「별 헤는 밤」을 쓰며 부끄러움을 성찰한 시인은?',['윤동주','김수영','서정주','백석'],0,'윤동주는 「자화상」, 「쉽게 씌어진 시」 등에서도 자기 성찰이 두드러져요.'),
 mcq('L15',15,'시조의 기본 형식으로 알맞은 것은?',['초장·중장·종장의 3장 구조','4행 12연의 정형시','10구체 향가 형식','후렴이 반복되는 분절체'],0,'시조는 3장 6구 4음보가 기본이고, 종장 첫 음보는 보통 3글자예요.')
],
10:[
 mcq('B01',15,'희소한 자원으로 하나를 선택할 때, 포기한 선택지 중 가장 가치가 큰 것을 무엇이라 할까?',['기회비용','매몰비용','한계비용','고정비용'],0,'사회·경제 지문의 기본 개념이에요. 이미 써서 되돌릴 수 없는 비용은 매몰비용이라 해요.'),
 mcq('B02',15,'단백질을 합성하는 데 필요하지만 체내에서 합성할 수 없어 음식으로 섭취해야 하는 아미노산은?',['필수아미노산','제한아미노산','비필수아미노산','유비퀴틴'],0,'과학 독서 지문의 핵심 용어예요. 제한아미노산과 헷갈리지 마세요.'),
 mcq('B03',15,'디지털 영상에서 화소들 사이의 밝기 차이를 무엇이라 할까?',['명암 대비','해상도','화솟값','가상 영상'],0,'명암 대비가 강할수록 영상이 선명하게 보여요. 해상도는 화소의 수예요.',0),
 mcq('B04',15,'인터뷰 기사의 편집 지침이 “인터뷰 때 질문한 순서대로 구성”일 때 알맞은 글의 짜임은?',['질문한 순서대로 내용을 배열한다','시대순으로 다시 배열한다','가장 인상 깊은 말부터 거꾸로 배열한다','질문을 빼고 요약만 싣는다'],0,'편집 지침과 실제 구성이 맞는지 하나씩 대응시켜 보는 게 화법·작문 문제의 요령이에요.',1),
 mcq('B05',15,'발표 주제가 “아름시장의 특징”일 때, 자료에서 전국 전통 시장 분포 내용을 뺀 이유로 가장 알맞은 것은?',['화제인 아름시장의 특징을 소개하는 데 필요하지 않아서','기사 내용이 거짓이어서','글자가 너무 작아서','발표 시간이 길어서'],0,'자료는 화제의 특징을 제시하는 데 필요한지로 골라요.',1),
 mcq('B06',15,'“백문이 불여일견이라고 하지요?”처럼 한자 성어를 써서 말할 때의 효과로 알맞은 것은?',['청중에게 직접 확인해 보도록 효과적으로 권유한다','자료의 출처를 밝힌다','발표 시간을 줄인다','청중의 잘못을 지적한다'],0,'말하기 전략은 표현의 기능으로 설명하는 것이 정답 포인트예요.',1),
 mcq('B07',15,'청자 두 명이 발표 내용에 공감했을 뿐 행동 변화는 말하지 않았다. 이때 “발표가 청자의 행동 변화를 이끌었다”고 분석한 것은?',['반응에 없는 근거를 더해 효과를 지나치게 일반화한 것','근거가 충분한 타당한 분석','출처를 밝히지 않은 오류','발표자의 의도를 파악한 훌륭한 분석'],0,'생각의 변화와 행동 변화를 구분해야 해요.',1),
 mcq('B08',15,'“형이 열심히 공부하는 민수에게 음료수를 주었다”에서 관형절 “열심히 공부하는”에서 생략된 성분은?',['주어 “민수가”','목적어','서술어','부사어'],0,'관형절로 안길 때 안은문장과 겹치는 성분(여기서는 주어)이 생략될 수 있어요.',1),
 mcq('B09',15,'“내가 주장하는 바는 주민 생활이 개선된다.”를 “…개선된다는 것이다.”로 고친 것은 무엇을 바로잡은 것일까?',['주어와 서술어의 호응','목적어의 생략','높임법','시제'],0,'“바는”으로 시작한 주어에는 “~것이다”로 끝나는 서술어가 어울려요.',1),
 mcq('B10',15,'“우리 모두 쓰레기 줄이기 운동을 동참합시다.”에서 고쳐야 할 부분은?',['“을”을 “에”로 고쳐 서술어가 요구하는 부사어로 쓴다','“합시다”를 “한다”로 바꾼다','“모두”를 뺀다','“운동”을 “활동”으로 바꾼다'],0,'“동참하다”는 “~에 동참하다”처럼 부사어를 요구해요.',1),
 mcq('B11',15,'“오가다”는 어간 “오-”와 “가-”가 연결어미 없이 직접 결합한 단어이다. 이런 단어를 무엇이라 할까?',['비통사적 합성어','통사적 합성어','파생어','단일어'],0,'“뛰어가다”처럼 연결어미가 낀 것은 통사적 합성어예요.',1),
 mcq('B12',15,'단백질 Q 1몰을 만드는 데 필수아미노산 A 2몰, B 3몰이 필요하다. A 4몰, B 3몰이 공급될 때 만들 수 있는 Q의 최대량은?',['1몰','2몰','1.5몰','3몰'],0,'필요량에 비해 공급 비율이 가장 낮은 B(3/3=1몰분)가 합성을 제한해요. 이 B가 제한아미노산입니다.',1),
 mcq('B13',15,'필요량에 비해 공급된 비율이 가장 낮아 단백질 합성량을 제한하는 필수아미노산을 무엇이라 할까?',['제한아미노산','비필수아미노산','요소','프로테아솜'],0,'동물성 단백질은 균형이 좋아 제한아미노산이 거의 없고, 식물성 단백질은 제한아미노산이 있는 경우가 많아요.',1),
 mcq('B14',15,'아미노산이 분해될 때 분리된 아미노기가 암모니아를 거쳐 합성되어 몸 밖으로 배출되는 물질은?',['요소','포도당','지방산','유비퀴틴'],0,'아미노기가 떨어지고 남은 부분은 에너지·포도당 생성이나 지방산 합성에 쓰여요.',1),
 mcq('B15',15,'영상을 2배 확대할 때 한 화소의 값을 네 화소에 그대로 복사하면 윤곽선이 격자처럼 보이는 현상은?',['모자이크 효과','명암 대비 강화','해상도 향상','잡음 제거'],0,'확대 복사 방법의 단점이에요. 선형 보간법이 이 현상을 줄여 줘요.',1),
 mcq('B16',15,'선형 보간법이 확대 복사 방법보다 모자이크 효과는 줄이지만 갖는 단점은?',['평균값을 계산해야 해서 처리 시간이 늘어난다','화소 수가 줄어든다','영상이 더 어두워진다','영상 저장이 불가능하다'],0,'개선한 방법에는 반드시 대가(처리 시간)가 따른다는 점을 지문에서 찾아요.',1),
 mcq('B17',15,'어떤 경제 활동이 제3자에게 대가 없이 이익이나 손해를 주는 현상은?',['외부 효과','규모의 경제','독점 가격','인플레이션'],0,'좋은 영향은 긍정적 외부 효과(양봉업자와 과수원), 나쁜 영향은 부정적 외부 효과(공해)예요.',1),
 mcq('B18',15,'다른 조건이 같을 때 가격이 오르면 소비자가 사려는 양이 줄어드는 관계를 나타낸 법칙은?',['수요의 법칙','공급의 법칙','한계효용 체감의 법칙','그레셤의 법칙'],0,'수요곡선이 우하향하는 이유예요. 공급의 법칙은 가격이 오르면 공급량이 늘어난다는 법칙입니다.',1),
 mcq('B19',15,'글을 비판적으로 읽을 때 가장 먼저 살필 점으로 알맞은 것은?',['주장의 근거가 타당하고 출처가 믿을 만한지','글자체가 예쁜지','문단 수가 홀수인지','글쓴이가 몇 살인지'],0,'독서 영역의 평가·비판 문제는 근거의 타당성과 신뢰성을 묻는 경우가 많아요.',1),
 mcq('B20',15,'표와 그래프가 함께 나온 사회 지문에서 그래프를 보고 가장 먼저 확인할 것은?',['제목, 단위, 축의 범위','색깔의 개수','글꼴 크기','그래프의 위치'],0,'단위와 축을 놓치면 수치를 잘못 읽게 돼요.',1),
 mcq('B21',15,'사회화 과정에서 개인이 처음으로 규범과 가치를 배우는 대표적인 집단은?',['가족','회사','정당','동호회'],0,'가족은 일차적 사회화 기관이에요. 학교·직장은 이후 단계에서 영향을 줍니다.',1)
],
11:[
 mcq('T01',15,'서울에서 버스와 지하철을 갈아탈 때 환승 할인이 되는 원리로 알맞은 것은?',['정해진 시간 안에 교통카드를 태그하고 갈아타면 할인이 적용된다','현금으로 낼 때만 할인이 된다','갈아탈 때마다 요금이 두 배가 된다','지하철끼리만 할인이 된다'],0,'교통카드를 내리고 다시 탈 때 찍는 것(태그)이 핵심이에요.'),

function addSpots(SPOTS){
  Object.keys(SPOTS).forEach(function(cid){
    var d=DEST_MAP[cid];if(!d)return;
    var list=SPOTS[cid].map(function(s){var a=s.split('|');return {n:a[0],type:a[1],fact:a[2]};});
    d.spots=list.map(function(sp,i){
      var qid='SP_'+cid+'_'+i,others=list.filter(function(_,j){return j!==i;}).map(function(o){return o.fact;});
      for(var k=others.length-1;k>0;k--){var r=Math.floor(Math.random()*(k+1)),tmp=others[k];others[k]=others[r];others[r]=tmp;}
      var it=mcq(qid,10,'“'+sp.n+'”은(는) 어떤 곳일까?',[sp.fact].concat(others.slice(0,3)),0,sp.n+' — '+sp.fact);
      var idx=it.o.map(function(_,j){return j;}).sort(function(){return Math.random()-.5;});it.so=idx.map(function(j){return it.o[j];});it.sa=idx.indexOf(it.a);
      it.cat=11;it.spot=1;QMAP[qid]=it;QUESTS[11].items.push(it);
      return {n:sp.n,type:sp.type,qid:qid};
    });
  });
}

function bgmStart(){
  if(BGM.on)return;
  try{
    if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();}
    if(AC.state==='suspended')AC.resume();
    BGM.bus=AC.createGain();BGM.bus.gain.value=0;BGM.lp=AC.createBiquadFilter();BGM.lp.type='lowpass';BGM.lp.frequency.value=2400;
    BGM.bus.connect(BGM.lp);BGM.lp.connect(AC.destination);BGM.on=true;bgmTick();
  }catch(e){}
}
function bgmSet(key){
  var p=key.split('|'),cc=p[0],inn=p[2]==='in'||(p[1]==='in');
  BGM.prof=MP[cc]||MP.home;BGM.root=p[1]&&p[1]!=='in'?((Math.abs(strHash(p[1]))%7)-2):0;BGM.idx=2;BGM.step=0;
  if(BGM.lp)BGM.lp.frequency.setTargetAtTime(inn?900:2400,AC.currentTime,.4);
  BGM.vol=inn?.035:.06;
}
function bgmNote(semi,dur,vol,w){
  var f=261.63*Math.pow(2,(semi+BGM.root)/12),t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=w;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(BGM.bus);o.start(t);o.stop(t+dur+.05);
}
function bgmTick(){
  clearTimeout(BGM.timer);if(!BGM.on)return;
  var pr=BGM.prof||MP.home;
  BGM.timer=setTimeout(bgmTick,pr.t);
  try{
    var want=(ST&&ST.snd)?1:0,tgt=want?(BGM.vol||.06):0;
    BGM.bus.gain.setTargetAtTime(tgt,AC.currentTime,.5);
    if(!want||AC.state!=='running')return;
    var sc=SC[pr.s],n=sc.length,s=BGM.step++;
    if(s%16===0){bgmNote(sc[0]-12+12*(pr.o>1?1:0),pr.t/1000*8,.5,'sine');if(pr.d)bgmNote(sc[0]-24+(pr.o>1?12:0),pr.t/1000*14,.35,'sine');}
    if(s%8===4&&n>2)bgmNote(sc[2%n]+12*pr.o-12,pr.t/1000*4,.28,'sine');
    if(Math.random()<pr.p){
      BGM.idx=Math.max(0,Math.min(n*2-1,BGM.idx+((Math.random()*3|0)-1)));
      var deg=BGM.idx%n,oc=(BGM.idx/n|0);
      bgmNote(sc[deg]+12*(oc+pr.o),pr.dec,.7,pr.w);
    }
  }catch(e){}
}

}

  return {uid:UID,nick:ST.nick,xp:z.xp,zq:z.q.f,zs:z.sim.f,zc:z.scam.f,ze:z.esc.f,zb:z.bingo.f,scamPct:z.scam.pct,
    coin:ST.coin||0,gc:ST.gc||'',tester:ST.tester?1:0,mg:ST.mg||{},bingoCells:Object.keys(ST.bingo).map(Number),lines:bs.lines.length,state:stripState(),ts:Date.now()};
}
function schedulePush(){
  if(!DB||!UID||!ST)return;
  if(window.ACCT&&!ST.acct)return;
  clearTimeout(pushT);
  pushT=setTimeout(function(){
    try{
      var p=payload(),key=JSON.stringify(Object.assign({},p,{ts:0}));
      if(key===lastPushed)return;
      lastPushed=key;
      var r=DB.doc('players/'+UID).set(p);
      if(r&&r.catch)r.catch(function(){SYNC='local';paintHud();});
    }catch(e){SYNC='local';paintHud();}
  },1500);
}
function classAgg(){
  var myGc=ST&&ST.gc&&ST.gc!=='*'?ST.gc:'';
  var list=PLAYERS.filter(function(p){return !p.tester&&p.uid!==UID&&(!myGc||p.gc===myGc);});
  var me=ST?payload():null;
  if(me&&!ST.tester)list.push(me);
  var n=list.length,total=list.reduce(function(a,p){return a+(p.xp||0);},0);
  var avg=function(k){return n?Math.round(list.reduce(function(a,p){return a+(p[k]||0);},0)/n*100):0;};
  var pop={};list.forEach(function(p){(p.bingoCells||[]).forEach(function(i){pop[i]=(pop[i]||0)+1;});});
  var top=Object.keys(pop).map(function(k){return [+k,pop[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,5);
  var goal=Math.max(CLASS_SIZE,n)*TARGET_PER_PERSON;
  var rl=list.slice();if(me&&ST.tester)rl.push(me);
  var rank={};RANK_LIST.forEach(function(g){rank[g.id]=rl.filter(function(p){return p.mg&&p.mg[g.id]>0;}).map(function(p){return {nick:p.nick||'?',s:p.mg[g.id]};}).sort(function(a,b){return b.s-a.s;}).slice(0,5);});
  return {rank:rank,n:n,total:total,goal:goal,pct:Math.min(100,Math.round(total/goal*100)),q:avg('zq'),s:avg('zs'),c:avg('zc'),e:avg('ze'),b:avg('zb'),
    def:n?Math.round(list.reduce(function(a,p){return a+(p.scamPct||0);},0)/n):0,top:top,lines:list.reduce(function(a,p){return a+(p.lines||0);},0)};
}
function initShared(){
  var timer=setTimeout(function(){if(SYNC==='checking'){SYNC='local';paintHud();}},10000);
  if(!window.claude||!claude.use){clearTimeout(timer);SYNC='local';paintHud();return;}
  Promise.all([claude.use('db'),claude.use('user')]).then(function(r){
    var d=r[0],u=r[1];
    if(!d||!u){clearTimeout(timer);SYNC='local';paintHud();return null;}
    return Promise.resolve(u.id()).then(function(id){
      DB=d;UID=id;clearTimeout(timer);SYNC='shared';paintHud();
      d.collection('players').onSnapshot(function(snap){
        PLAYERS=normalize(snap);
        var mine=PLAYERS.filter(function(p){return p.uid===UID;})[0];
        if(!ST&&mine&&mine.state){ST=fixState(mine.state);saveLocal();if(OV&&OV.isTitle)OV.render();}
        paintHud();
      },function(){SYNC='local';paintHud();});
      schedulePush();
    });
  }).catch(function(){clearTimeout(timer);SYNC='local';paintHud();});
}
function paintHud(){
  var chip=$('#hs');if(chip)chip.textContent=SYNC==='shared'?'☁️ 반 연결':(SYNC==='checking'?'⏳ 확인중':'📱 이 기기만');
  if(!ST){$('#hn').textContent='—';$('#hl').textContent='Lv.1';$('#hx').style.width='0';$('#hxt').textContent='';return;}
  var z=zones(ST),lv=level(z.xp),base=(lv-1)*150,nxt=lv>=LEVELS.length?null:lv*150;
  $('#hn').textContent=ST.nick;$('#hl').textContent='Lv.'+lv+' '+LEVELS[lv-1];
  $('#hx').style.width=(nxt?Math.round((z.xp-base)/(nxt-base)*100):100)+'%';
  $('#hxt').textContent=z.xp+' XP · 🪙'+(ST.coin||0);
  $('#hc').textContent='🌍 반 '+classAgg().pct+'%';
}

function questDone(st,q){
  var k=q.k,v=st.visit||{},f=st.flags||{};
  if(q.gym)return !!(st.esc2.f[+k.slice(1)]);
  if(!v[k])return false;
  if(k==='arcade')return !!f.arc;
  if(k==='drive')return !!f.drv;
  if(k==='station')return !!f.tripT;
  if(k==='airport')return !!f.tripA;
  var c=+k.slice(1),ok=false;
  QUESTS[c].items.forEach(function(it){if(st.q[it.id])ok=true;});
  return ok;
}
function questXp(st){var n=0;questTypes().forEach(function(q){if(!q.gym&&questDone(st,q))n+=10;});return n;}

function camCenter(m,fx,fy){
  var cx=fx+0.5,cy=fy+0.5;

    if(best){var w=Math.max(0,Math.min(1,(17-bd)/8));var px=fx+0.5,py=fy+0.5;cx+=(best[0]-cx)*w*0.62;cy+=(best[1]-cy)*w;cy=Math.max(cy,py-3.6);cx=Math.max(px-5.8,Math.min(px+5.8,cx));}}
  return [cx,cy];
}

var DLG=null;
function paginate(s){
  var out=[],cur='';
  var parts=String(s).match(/[^.!?…]+[.!?…]*\s*/g)||[String(s)];
  parts.forEach(function(p){
    p=p.trim();if(!p)return;
    while(p.length>70){
      var cut=p.lastIndexOf(' ',70);if(cut<20)cut=70;
      if(cur){out.push(cur);cur='';}
      out.push(p.slice(0,cut).trim());p=p.slice(cut).trim();
    }
    if(!p)return;
    if(!cur)cur=p;else if((cur+' '+p).length<=70)cur+=' '+p;else{out.push(cur);cur=p;}
  });
  if(cur)out.push(cur);
  return out;
}
function say(lines,cb){
  var pages=[];
  lines.forEach(function(l){var nm='',tx=l;if(Array.isArray(l)){nm=l[0];tx=l[1];}paginate(tx).forEach(function(p){pages.push({n:nm,t:p});});});
  if(!pages.length){if(cb)cb();return;}
  DLG={pages:pages,i:0,t:0,shown:0,done:false,len:pages[0].t.length,cb:cb||null};
  $('#dlg').style.display='block';renderDlg();
}
function renderDlg(){
  if(!DLG)return;
  var p=DLG.pages[DLG.i];
  $('#dlg').innerHTML=(p.n?'<span class="dn">'+esc(p.n)+'</span><br>':'')+'<div class="dx">'+esc(p.t.slice(0,DLG.shown))+'</div>'+(DLG.done?'<span class="dm">▼</span>':'');
}
function dlgAdvance(){
  if(!DLG)return;
  if(!DLG.done){DLG.shown=DLG.len;DLG.done=true;renderDlg();return;}
  beep(600,.03);
  if(DLG.i<DLG.pages.length-1){DLG.i++;DLG.t=0;DLG.shown=0;DLG.done=false;DLG.len=DLG.pages[DLG.i].t.length;renderDlg();}
  else{var cb=DLG.cb;DLG=null;$('#dlg').style.display='none';$('#dlg').innerHTML='';if(cb)cb();}
}

var OV=null;
function openOv(o){OV=o;$('#ov').hidden=false;o.render();return o;}
function closeOv(){if(OV&&OV.stop){try{OV.stop();}catch(e){}}OV=null;$('#ov').hidden=true;$('#ov').innerHTML='';HELD.length=0;}
function hpBar(p){return '<div class="hp"><i style="width:'+p+'%;'+(p<35?'background:#ef4444':(p<65?'background:#f0c030':''))+'"></i></div>';}
function listScreen(o){
  var s={cur:o.cur||0,o:o,lock:false};
  s.render=function(){
    var hd=typeof o.head==='function'?o.head():o.head, bd=typeof o.body==='function'?o.body(s.cur):o.body;
    var h='<div class="win">';
    if(hd)h+='<div class="hd">'+hd+'</div>';
    if(bd)h+='<div class="bd">'+bd+'</div>';
    h+='<div class="ls">'+o.items.map(function(it,i){
      return '<div class="li'+(i===s.cur?' cur':'')+(it.dis?' dis':'')+'" data-i="'+i+'"><span class="ar">'+(i===s.cur?'▶':'')+'</span><span>'+(it.chk!=null?(it.chk?'☑ ':'☐ '):'')+esc(it.t)+'</span></div>';
    }).join('')+'</div>';
    if(o.foot)h+='<div class="ft">'+o.foot+'</div>';
    h+='<div class="bt">'+(o.onB?'<button data-b="1">B · 뒤로</button>':'')+'<button data-a="1">A · 선택</button></div></div>';
    $('#ov').innerHTML=h;
    var c=$('#ov .li.cur');if(c&&c.scrollIntoView)c.scrollIntoView({block:'nearest'});
  };
  s.key=function(k){
    if(s.lock)return;
    var n=o.items.length;
    if(k==='up'){s.cur=(s.cur+n-1)%n;s.render();beep(520,.03);}
    else if(k==='down'){s.cur=(s.cur+1)%n;s.render();beep(520,.03);}
    else if(k==='a'||k==='start'){beep(760,.05);o.onSel(s.cur,s);}
    else if(k==='b'&&o.onB){o.onB(s);}
  };
  s.pick=function(i){if(s.lock)return;s.cur=i;s.render();beep(760,.05);o.onSel(i,s);};
  return openOv(s);
}

    },

    var score=Math.max(0,Math.round((hit-fp*0.5)/total*100)),prev=ST.scam[c.id],first=!(prev>=80)&&score>=80,ok=score>=80;

      if(s[1])return '<div class="no">⚠️ 놓쳤다: '+t+'<div class="sub">'+esc(s[1].trim())+'</div></div>';

      return '';

      head:function(){return '<span class="emo">'+mon.emo+'</span><div style="flex:1"><div>'+esc(mon.name)+(ok?' — 봉인 성공!':' — 아직 날뛰고 있다!')+'</div>'+hpBar(100-score)+'</div>';},
      body:'<div class="big">'+score+'점</div><div class="sub">찾은 위험 '+hit+'/'+total+'개'+(fp?' · 잘못 고른 곳 '+fp+'개':'')+(ok?' · 80점 이상이면 봉인!':' · 80점 이상이면 봉인할 수 있어요.')+'</div><div style="margin-top:8px">'+det+'</div><div class="msg">🛡️ 이럴 땐 이렇게! '+esc(c.act)+'</div>',

      onSel:function(i){
        if(ok){closeOv();say([['',mon.name+'을(를) 사기 도감에 등록했다!'+(first?' 새로운 도감 등록!':'')]]);}

function gameTiming(){
  var s={round:0,pos:0,dir:1,c:50,w:10,sc:[],run:false,raf:0,last:0,to:0};
  function startRound(){
    s.c=22+Math.floor(Math.random()*56);s.w=Math.max(4,10-s.round*1.5);s.pos=Math.random()<.5?0:100;s.dir=s.pos?-1:1;s.run=true;s.last=0;
    var z=$('#mgz'),f=$('#mgf');if(z){z.style.left=(s.c-s.w)+'%';z.style.width=(s.w*2)+'%';}if(f)f.textContent='';
    var r=$('#mgr');if(r)r.textContent='ROUND '+(s.round+1)+' / 5 · 합계 '+s.sc.reduce(function(a,b){return a+b;},0);
    s.raf=requestAnimationFrame(tick);
  }
  function tick(ts){
    if(!s.run)return;
    if(s.last){var v=(0.045+s.round*0.015)*(ts-s.last);s.pos+=s.dir*v;if(s.pos>=100){s.pos=100;s.dir=-1;}if(s.pos<=0){s.pos=0;s.dir=1;}}
    s.last=ts;var m=$('#mgm');if(m)m.style.left=s.pos+'%';
    s.raf=requestAnimationFrame(tick);
  }
  function stop(){
    if(!s.run)return;s.run=false;cancelAnimationFrame(s.raf);
    var d=Math.abs(s.pos-s.c),pts=Math.max(0,Math.round(100-d*4));if(d<=s.w*0.35)pts=100;
    s.sc.push(pts);beep(pts>=80?880:300,.08);
    var f=$('#mgf');if(f)f.textContent=pts>=100?'🎯 PERFECT! +100':(pts>0?'+'+pts+'점':'앗! 0점');
    s.round++;
    s.to=setTimeout(function(){if(OV!==s)return;if(s.round>=5)mgFinish('g1',s.sc.reduce(function(a,b){return a+b;},0));else startRound();},800);
  }
  s.render=function(){
    $('#ov').innerHTML=mgShell('🎯 타이밍 스톱','<div class="sub">움직이는 ▼ 를 초록 영역에 맞춰 A(Z/Space) 또는 정지 버튼! 5라운드, 라운드마다 빨라지고 영역이 좁아져요.</div><div id="mgr" class="msg" style="text-align:center"></div><div class="tb"><div id="mgz" class="tz"></div><div id="mgm" class="tm">▼</div></div><div id="mgf" class="big" style="min-height:1.6em"></div>','<button class="btn pri" data-btn="stop">정지!</button>');
    startRound();
  };
  s.key=function(k){if(k==='a'||k==='start')stop();else if(k==='b'){closeOv();}};
  s.btn=function(b){if(b==='stop')stop();};
  s.stop=function(){s.run=false;cancelAnimationFrame(s.raf);clearTimeout(s.to);};
  openOv(s);
}
function gameMemory(){

  var s={len:3,seq:[],inp:0,cleared:0,phase:'show',to:0};
  function newSeq(){s.seq=[];for(var i=0;i<s.len;i++)s.seq.push(Math.floor(Math.random()*4));s.inp=0;showSeq();}
  function showSeq(){
    s.phase='show';var i=0,box=$('#mgs'),inf=$('#mgi');
    if(inf)inf.textContent='잘 보세요! ('+s.len+'개)';

      s.to=setTimeout(function(){if(box)box.textContent='';i++;s.to=setTimeout(step,200);},Math.max(280,560-s.len*18));

  function input(v){

    }else{s.phase='over';beep(180,.2,'sawtooth');var inf2=$('#mgi');if(inf2)inf2.textContent='❌ 틀렸어요!';s.to=setTimeout(function(){if(OV===s)mgFinish('g2',s.cleared);},800);}

  s.stop=function(){clearTimeout(s.to);};
  openOv(s);
}
function gameMath(){
  var s={t:30,sc:0,ok:0,ng:0,q:null,iv:0,done:false};
  function mkQ(){
    var a,b,ans,txt,r=Math.random();
    if(r<.4){a=10+Math.floor(Math.random()*80);b=10+Math.floor(Math.random()*80);ans=a+b;txt=a+' + '+b;}
    else if(r<.7){a=30+Math.floor(Math.random()*70);b=10+Math.floor(Math.random()*(a-10));ans=a-b;txt=a+' − '+b;}
    else{a=3+Math.floor(Math.random()*10);b=3+Math.floor(Math.random()*10);ans=a*b;txt=a+' × '+b;}
    var opts=[ans],cand=[ans+1,ans-1,ans+10,ans-10,ans+2,ans-2,ans+(ans%10?9:11)];
    cand.sort(function(){return Math.random()-.5;});
    for(var i=0;i<cand.length&&opts.length<4;i++){if(cand[i]>0&&opts.indexOf(cand[i])<0)opts.push(cand[i]);}
    opts.sort(function(){return Math.random()-.5;});
    s.q={txt:txt,ans:ans,opts:opts};
  }
  function paint(){
    var q=s.q;$('#mgq').textContent=q.txt+' = ?';
    q.opts.forEach(function(o,i){var b=$('#mgo'+i);if(b)b.textContent=(i+1)+'  '+o;});
    $('#mgt').textContent='⏱ '+Math.ceil(s.t)+'초 · 점수 '+Math.max(0,s.sc);
  }
  function pick(i){
    if(s.done)return;
    if(s.q.opts[i]===s.q.ans){s.ok++;s.sc+=10;beep(760,.04);}else{s.ng++;s.sc=Math.max(0,s.sc-5);beep(200,.08,'sawtooth');}
    mkQ();paint();
  }
  function end(){s.done=true;clearInterval(s.iv);mgFinish('g3',Math.max(0,s.sc));}
  s.render=function(){
    $('#ov').innerHTML=mgShell('➕ 암산 스피드','<div class="sub">30초 동안 최대한 많이! 정답 +10, 오답 −5. (키보드 1~4 또는 터치)</div><div id="mgt" class="msg" style="text-align:center"></div><div id="mgq" class="big" style="margin:6px 0"></div><div class="og"><button id="mgo0" data-btn="o0"></button><button id="mgo1" data-btn="o1"></button><button id="mgo2" data-btn="o2"></button><button id="mgo3" data-btn="o3"></button></div>','<button data-btn="quit">그만하기</button>');
    mkQ();paint();
    s.iv=setInterval(function(){s.t-=0.1;if(s.t<=0){s.t=0;paint();end();}else paint();},100);
  };
  s.key=function(k){var m={n1:0,n2:1,n3:2,n4:3};if(m[k]!=null)pick(m[k]);else if(k==='b'){closeOv();}};
  s.btn=function(b){if(b==='quit'){end();return;}if(b.charAt(0)==='o')pick(+b.charAt(1));};
  s.stop=function(){clearInterval(s.iv);};
  openOv(s);
}

function formScreen(o){
  /* o: head, sub, fields[{id,type,ph,max}], ok, extra[{id,label}], onOk(vals,s), onExtra(id), onBack */
  var s={err:'',busy:false,vals:{}};
  s.render=function(){
    var f=o.fields.map(function(x){return '<div style="margin-top:8px"><input type="'+x.type+'" id="f_'+x.id+'" maxlength="'+(x.max||20)+'" placeholder="'+esc(x.ph)+'" autocomplete="'+(x.type==='password'?'new-password':'off')+'" value="'+esc(s.vals[x.id]||'')+'"></div>';}).join('');
    var ex=(o.extra||[]).map(function(x){return '<button data-btn="x_'+x.id+'">'+esc(x.label)+'</button>';}).join('');
    $('#ov').innerHTML='<div class="win"><div class="hd">'+o.head+'</div><div class="bd"><div class="sub">'+o.sub+'</div>'+f+(s.err?'<div class="msg">'+esc(s.err)+'</div>':'')+'</div><div class="bt"><button class="btn pri" data-btn="ok">'+(s.busy?'확인 중…':o.ok)+'</button>'+ex+(o.onBack?'<button data-btn="back">← 뒤로</button>':'')+'</div></div>';
    var tgt=null;
    o.fields.forEach(function(x){var el=$('#f_'+x.id);if(!el)return;if(!tgt&&!el.value)tgt=el;el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();s.btn('ok');}});});
    if(!tgt)tgt=$('#f_'+o.fields[0].id);if(tgt)tgt.focus();
  };
  function read(){o.fields.forEach(function(x){var el=$('#f_'+x.id);if(el)s.vals[x.id]=el.value;});}
  s.key=function(k){};
  s.btn=function(b){
    if(s.busy)return;
    read();
    if(b==='back'){o.onBack&&o.onBack();return;}
    if(b.indexOf('x_')===0){o.onExtra&&o.onExtra(b.slice(2),s);return;}
    s.err='';
    var r=o.onOk(s.vals,s);
    if(r===false)return;
  };
  s.fail=function(m){s.busy=false;s.err=m;s.render();};
  s.work=function(){s.busy=true;s.render();};
  openOv(s);
}
